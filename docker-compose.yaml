name: autoware_manual_control_ws
services:
  autoware:
    network_mode: host
    image: ghcr.io/autowarefoundation/autoware:universe
    volumes:
      - autoware_map:/autoware_map
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    command: >
      bash -c "source /opt/ros/humble/setup.bash && ros2 launch autoware_launch planning_simulator.launch.xml map_path:=/autoware_map vehicle_model:=sample_vehicle sensor_model:=sample_sensor_kit rviz:=false"

  visualizer:
    network_mode: host
    image: ghcr.io/autowarefoundation/autoware-tools:visualizer-20251009
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - REMOTE_PASSWORD=o
      - USE_SIM_TIME=false
    extra_hosts:
      - "${HOSTNAME:-localhost}:127.0.0.1"

  teleop:
    network_mode: host
    build: .
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    volumes:
      - .:/autoware_manual_control_ws/src/autoware_manual_control
    working_dir: /autoware_manual_control_ws
    command: sleep infinity

  # Bridges Autoware's DDS to Zenoh on 7447 for the native_zenoh transport.
  # Only started for the zenoh transport (profile), shares autoware's DDS via
  # host networking, and serves the teleop over tcp/7447.
  zenoh_bridge:
    profiles: ["zenoh"]
    network_mode: host
    image: eclipse/zenoh-bridge-ros2dds:1.9.0
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DISTRO=humble
    volumes:
      - ./config/zenoh-bridge-ros2dds-conf.json5:/config/zenoh-bridge-ros2dds-conf.json5:ro
    command: ["-n", "/v1", "-c", "/config/zenoh-bridge-ros2dds-conf.json5"]

volumes:
  autoware_map:
    # Use the manually created external volume to avoid "project name" prefix mismatch
    external: true
