# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# The docs are an mdBook (book/), not Sphinx, so the build is overridden with
# explicit commands; each command runs in its own shell, hence the inline PATH.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - mkdir -p $HOME/.local/bin
    - curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
    - curl -fsSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.14.0/mdbook-mermaid-v0.14.0-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C $HOME/.local/bin
    - PATH=$HOME/.local/bin:$PATH mdbook build book --dest-dir $READTHEDOCS_OUTPUT/html
